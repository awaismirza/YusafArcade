<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Yusaf Arcade</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #2b2266 0%, #120d2e 100%);
        touch-action: none;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      /* Board games on iPads: labels and buttons sit in the space above and below the board, not on it. */
      #board-top,
      #board-bottom {
        display: none;
        flex: 0 0 auto;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        font-family: Nunito, system-ui, sans-serif;
        color: #ffffff;
      }
      #board-top { height: 64px; padding-top: env(safe-area-inset-top); }
      #board-bottom { height: 56px; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
      body.board-chrome #board-top,
      body.board-chrome #board-bottom { display: flex; }
      .bc-btn {
        flex: 0 0 auto;
        height: 48px;
        min-width: 110px;
        padding: 0 16px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(27, 22, 64, 0.6);
        color: #fff;
        font: 800 18px/1 Nunito, system-ui, sans-serif;
        touch-action: manipulation;
      }
      .bc-chip {
        padding: 8px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(27, 22, 64, 0.55);
        font-weight: 800;
        white-space: nowrap;
      }
      .bc-chip:empty { display: none; }
      #bc-status { font-size: 24px; margin: 0 auto; }
      #bc-counts { font-size: 17px; }
      #bc-detail { font-size: 16px; font-weight: 700; white-space: normal; text-align: center; max-width: 92vw; line-height: 1.25; }
      #bc-views {
        position: fixed;
        z-index: 40;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #bc-views.open { display: flex; }
      #bc-views button.current { background: #7c3aed; }
      #game {
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      #touch {
        display: none;
        flex: 0 0 auto;
        align-items: stretch;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(18, 13, 46, 0.92);
        user-select: none;
        -webkit-user-select: none;
      }
      body.runner-touch #touch {
        display: flex;
      }
      #flap-bar {
        display: none;
        flex: 0 0 auto;
        justify-content: center;
        gap: 12px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(18, 13, 46, 0.92);
      }
      body.flappy-touch #flap-bar {
        display: flex;
      }
      #end-bar {
        display: none;
        flex: 0 0 auto;
        justify-content: center;
        gap: 14px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(18, 13, 46, 0.92);
      }
      body.gameover-touch #end-bar {
        display: flex;
      }
      #btn-restart,
      #btn-main-menu {
        flex: 1;
        max-width: 220px;
        min-height: 64px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        font: 800 21px/1 Nunito, system-ui, sans-serif;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.28), inset 0 2px 0 rgba(255, 255, 255, 0.35);
      }
      #btn-restart:active,
      #btn-main-menu:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28); }
      #btn-restart { background: linear-gradient(180deg, #34b45f, #15803d); }
      #btn-main-menu { background: linear-gradient(180deg, #6a7cf5, #4f46e5); }
      #btn-flap-menu {
        flex: 0 0 auto;
        min-width: 110px;
        min-height: 72px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        background: rgba(40, 32, 100, 0.9);
        color: #ffffff;
        font: 800 20px/1 Nunito, system-ui, sans-serif;
        touch-action: manipulation;
      }
      #btn-flap {
        flex: 1;
        max-width: 420px;
        min-height: 72px;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(180deg, #ffd84d, #eab308);
        color: #2b2250;
        font: 800 25px/1 Nunito, system-ui, sans-serif;
        border-radius: 999px;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.45);
      }
      .cluster {
        display: flex;
        gap: 10px;
        align-items: stretch;
      }
      #touch button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        min-width: 92px;
        min-height: 64px;
        padding: 0 16px;
        font: 800 18px/1 Nunito, system-ui, sans-serif;
        color: #f8fafc;
        border-radius: 22px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.28), inset 0 2px 0 rgba(255, 255, 255, 0.3);
        touch-action: none;
      }
      #btn-jump { background: #2563eb; }
      #btn-duck { background: #6d28d9; }
      #btn-sword { background: #b91c1c; }
      #btn-shoot { background: #15803d; min-width: 128px; }
      @media (min-width: 800px) {
        #touch { padding: 14px 28px calc(14px + env(safe-area-inset-bottom)); gap: 20px; }
        #touch button { min-width: 140px; min-height: 84px; font-size: 22px; border-radius: 20px; }
        #btn-shoot { min-width: 180px; }
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(15, 15, 20, 0.92);
        color: #f8fafc;
        font: 600 20px/1.4 system-ui, sans-serif;
        text-align: center;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        body.runner-touch #rotate { display: flex; }
      }
      /* Games are made for landscape. In portrait they still work, but the board is small, so say so. */
      #portrait-hint {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 15;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        text-align: center;
        background: rgba(15, 23, 42, 0.92);
        color: #e2e8f0;
        font: 600 17px/1.3 system-ui, sans-serif;
        pointer-events: none;
      }
      @media (orientation: portrait) {
        #portrait-hint { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="board-top">
      <button class="bc-btn" id="bc-menu" type="button">‹ Menu</button>
      <button class="bc-btn" id="bc-view" type="button">📷 View</button>
      <div class="bc-chip" id="bc-status"></div>
      <div class="bc-chip" id="bc-counts"></div>
    </div>
    <div id="bc-views"></div>
    <div id="game"></div>
    <div id="board-bottom"><div class="bc-chip" id="bc-detail"></div></div>
    <div id="touch" aria-label="Touch controls">
      <div class="cluster">
        <button id="btn-jump" type="button">Jump</button>
        <button id="btn-duck" type="button">Duck</button>
      </div>
      <div class="cluster">
        <button id="btn-sword" type="button">Sword</button>
        <button id="btn-shoot" type="button">Shoot</button>
      </div>
    </div>
    <div id="flap-bar" aria-label="Flappy controls">
      <button id="btn-flap-menu" type="button">‹ Menu</button>
      <button id="btn-flap" type="button">Flap</button>
    </div>
    <div id="end-bar" aria-label="Game over">
      <button id="btn-restart" type="button">Restart</button>
      <button id="btn-main-menu" type="button">Main Menu</button>
    </div>
    <div id="rotate">Turn the phone sideways for Batman Shooting Game.</div>
    <div id="portrait-hint">↻ Turn your iPad sideways for a bigger board</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
